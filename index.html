<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Keuangan (Neon.tech Database Mirror)</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SheetJS untuk Ekspor Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Chart.js untuk Pie Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card-stat {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .badge-income {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .badge-expense {
            background-color: #f8d7da;
            color: #842029;
        }
    </style>
</head>
<body>

    <div class="container py-4" style="max-width: 1000px;">
        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">💰 Catatan Keuangan</h2>
            <p class="text-muted small">🟢 Mirroring dari Database Neon.tech</p>
        </div>

        <!-- Ringkasan Keuangan (Dashboard Terfilter) -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card card-stat bg-primary text-white p-3">
                    <div class="small opacity-75">Sisa Saldo (Terfilter)</div>
                    <div class="h3 fw-bold mb-0" id="totalSaldo">Rp 0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat bg-success text-white p-3">
                    <div class="small opacity-75">Total Pemasukan (Terfilter)</div>
                    <div class="h3 fw-bold mb-0" id="totalPemasukan">Rp 0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat bg-danger text-white p-3">
                    <div class="small opacity-75">Total Pengeluaran (Terfilter)</div>
                    <div class="h3 fw-bold mb-0" id="totalPengeluaran">Rp 0</div>
                </div>
            </div>
        </div>

        <!-- Section Filter & Diagram (Pie Chart) -->
        <div class="row g-4 mb-4">
            <!-- Filter Data -->
            <div class="col-md-6">
                <div class="card card-stat p-3 h-100">
                    <h5 class="fw-bold mb-3">🔍 Filter Transaksi</h5>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label small text-muted">Periode Waktu</label>
                            <select id="filterPeriode" class="form-select form-select-sm" onchange="tanganiPerubahanPeriode()">
                                <option value="semua">Semua Waktu</option>
                                <option value="bulan_ini">Bulan Ini</option>
                                <option value="tahun_ini">Tahun Ini</option>
                                <option value="rentang">Rentang Tanggal</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label small text-muted">Kategori Transaksi</label>
                            <select id="filterKategori" class="form-select form-select-sm" onchange="perbaruiTampilan()">
                                <option value="semua">Semua Kategori</option>
                            </select>
                        </div>
                        <!-- Input Rentang Tanggal -->
                        <div class="col-6 d-none" id="boxTglMulai">
                            <label class="form-label small text-muted">Tanggal Mulai</label>
                            <input type="date" id="filterTglMulai" class="form-control form-control-sm" onchange="perbaruiTampilan()">
                        </div>
                        <div class="col-6 d-none" id="boxTglSelesai">
                            <label class="form-label small text-muted">Tanggal Selesai</label>
                            <input type="date" id="filterTglSelesai" class="form-control form-control-sm" onchange="perbaruiTampilan()">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pie Chart Pengeluaran -->
            <div class="col-md-6">
                <div class="card card-stat p-3 h-100">
                    <h5 class="fw-bold mb-2">📊 Pie Chart Pengeluaran</h5>
                    <div class="d-flex justify-content-center align-items-center" style="max-height: 220px;">
                        <canvas id="chartPengeluaran"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Form Input Transaksi -->
            <div class="col-md-5">
                <div class="card card-stat p-3">
                    <h5 class="fw-bold mb-3">Tambah Transaksi</h5>
                    <form id="formTransaksi">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Tanggal</label>
                            <input type="date" id="tanggal" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Jenis Transaksi</label>
                            <select id="jenis" class="form-select" onchange="perbaruiDropdownKategoriForm()" required>
                                <option value="pemasukan">Pemasukan (+)</option>
                                <option value="pengeluaran">Pengeluaran (-)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Kategori</label>
                            <select id="kategori" class="form-select" required>
                                <!-- Diisi otomatis via JS -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Jumlah (Rp)</label>
                            <input type="number" id="nominal" class="form-control" placeholder="0" min="1" required>
                        </div>
                        <button type="submit" id="btnSimpan" class="btn btn-primary w-100 fw-semibold">
                            Simpan Ke Database
                        </button>
                    </form>
                </div>
            </div>

            <!-- Tabel Riwayat Transaksi -->
            <div class="col-md-7">
                <div class="card card-stat p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h5 class="fw-bold mb-0">Riwayat Transaksi</h5>
                        <div class="d-flex gap-2">
                            <button onclick="eksporKeExcel()" class="btn btn-success btn-sm">📊 Ekspor Excel</button>
                            <button onclick="hapusSemuaData()" class="btn btn-outline-danger btn-sm">Reset Data</button>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Tanggal</th>
                                    <th>Kategori</th>
                                    <th>Nominal</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tabelRiwayat">
                                <!-- Data dimuat dari Neon.tech -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Memanggil API relatif yang aman (Akan diproses Vercel)
        const API_URL = '/api/transaksi';

        const opsiKategori = {
            pemasukan: ['Gaji', 'penjualan', 'lainnya'],
            pengeluaran: [
                'Belanja Bahan Baku',
                'Transportasi',
                'Makan/Minum',
                'Donasi',
                'Kecantikan',
                'Telepon',
                'Fashion',
                'Kebutuhan lainnya'
            ]
        };

        let daftarTransaksi = [];
        let pieChartInstance = null;

        document.getElementById('tanggal').valueAsDate = new Date();

        // 1. Ambil Data Transaksi dari Serverless API (Neon.tech)
        async function muatDataDariNeon() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Gagal mengambil data dari server");
                
                daftarTransaksi = await res.json();
                perbaruiTampilan();
            } catch (err) {
                console.error("Kesalahan Fetch Neon:", err);
            }
        }

        // 2. Inisialisasi Dropdown Kategori
        function perbaruiDropdownKategoriForm() {
            const jenis = document.getElementById('jenis').value;
            const selectKategori = document.getElementById('kategori');
            selectKategori.innerHTML = '';
            
            opsiKategori[jenis].forEach(kat => {
                selectKategori.innerHTML += `<option value="${kat}">${kat}</option>`;
            });
        }

        function isiDropdownFilterKategori() {
            const selectFilter = document.getElementById('filterKategori');
            selectFilter.innerHTML = `<option value="semua">Semua Kategori</option>`;

            const semuaKat = [...opsiKategori.pemasukan, ...opsiKategori.pengeluaran];
            semuaKat.forEach(kat => {
                selectFilter.innerHTML += `<option value="${kat}">${kat}</option>`;
            });
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                maximumFractionDigits: 0
            }).format(angka);
        }

        function tanganiPerubahanPeriode() {
            const val = document.getElementById('filterPeriode').value;
            const boxMulai = document.getElementById('boxTglMulai');
            const boxSelesai = document.getElementById('boxTglSelesai');

            if (val === 'rentang') {
                boxMulai.classList.remove('d-none');
                boxSelesai.classList.remove('d-none');
            } else {
                boxMulai.classList.add('d-none');
                boxSelesai.classList.add('d-none');
            }
            perbaruiTampilan();
        }

        // 3. Render Tampilan UI Terfilter
        function perbaruiTampilan() {
            const periodeFilter = document.getElementById('filterPeriode').value;
            const kategoriFilter = document.getElementById('filterKategori').value;
            const tglMulai = document.getElementById('filterTglMulai').value;
            const tglSelesai = document.getElementById('filterTglSelesai').value;

            const hariIni = new Date();
            const bulanIni = hariIni.getMonth();
            const tahunIni = hariIni.getFullYear();

            // Filter data lokal hasil fetch Neon
            const dataTerfilter = daftarTransaksi.filter(item => {
                const tglString = typeof item.tanggal === 'string' ? item.tanggal.split('T')[0] : item.tanggal;
                const tglItem = new Date(tglString);
                
                if (periodeFilter === 'bulan_ini') {
                    if (tglItem.getMonth() !== bulanIni || tglItem.getFullYear() !== tahunIni) return false;
                } else if (periodeFilter === 'tahun_ini') {
                    if (tglItem.getFullYear() !== tahunIni) return false;
                } else if (periodeFilter === 'rentang') {
                    if (tglMulai && tglString < tglMulai) return false;
                    if (tglSelesai && tglString > tglSelesai) return false;
                }

                if (kategoriFilter !== 'semua' && item.kategori !== kategoriFilter) {
                    return false;
                }

                return true;
            });

            const tabelRiwayat = document.getElementById('tabelRiwayat');
            tabelRiwayat.innerHTML = '';
            let totalPemasukan = 0, totalPengeluaran = 0;
            const pengeluaranPerKategori = {};

            if (dataTerfilter.length === 0) {
                tabelRiwayat.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-3">Tidak ada data transaksi.</td></tr>`;
            } else {
                dataTerfilter.forEach((item) => {
                    const isIncome = item.jenis === 'pemasukan';
                    const nominalNum = Number(item.nominal);
                    const tglFormat = typeof item.tanggal === 'string' ? item.tanggal.split('T')[0] : item.tanggal;

                    if (isIncome) {
                        totalPemasukan += nominalNum;
                    } else {
                        totalPengeluaran += nominalNum;
                        pengeluaranPerKategori[item.kategori] = (pengeluaranPerKategori[item.kategori] || 0) + nominalNum;
                    }

                    tabelRiwayat.innerHTML += `
                        <tr>
                            <td class="small text-muted">${tglFormat}</td>
                            <td>
                                <span class="badge ${isIncome ? 'badge-income' : 'badge-expense'} me-1">
                                    ${isIncome ? 'In' : 'Out'}
                                </span>
                                <strong>${item.kategori}</strong>
                            </td>
                            <td class="${isIncome ? 'text-success' : 'text-danger'} fw-semibold">
                                ${isIncome ? '+' : '-'} ${formatRupiah(nominalNum)}
                            </td>
                            <td>
                                <button onclick="hapusTransaksi(${item.id})" class="btn btn-sm btn-link text-danger p-0 text-decoration-none">Hapus</button>
                            </td>
                        </tr>`;
                });
            }

            document.getElementById('totalPemasukan').innerText = formatRupiah(totalPemasukan);
            document.getElementById('totalPengeluaran').innerText = formatRupiah(totalPengeluaran);
            document.getElementById('totalSaldo').innerText = formatRupiah(totalPemasukan - totalPengeluaran);

            perbaruiPieChart(pengeluaranPerKategori);
        }

        // 4. Update Chart Pengeluaran
        function perbaruiPieChart(dataPengeluaran) {
            const ctx = document.getElementById('chartPengeluaran').getContext('2d');
            const labels = Object.keys(dataPengeluaran);
            const dataValues = Object.values(dataPengeluaran);

            if (pieChartInstance) {
                pieChartInstance.destroy();
            }

            if (labels.length === 0) {
                pieChartInstance = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['Tidak Ada Pengeluaran'],
                        datasets: [{ data: [1], backgroundColor: ['#e0e0e0'] }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });
                return;
            }

            const warnaBackground = [
                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', 
                '#9966FF', '#FF9F40', '#E7E9ED', '#8AC926'
            ];

            pieChartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: warnaBackground.slice(0, labels.length)
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                    }
                }
            });
        }

        // 5. Tambah Transaksi ke Database Neon via API
        document.getElementById('formTransaksi').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btnSimpan = document.getElementById('btnSimpan');
            btnSimpan.disabled = true;
            btnSimpan.innerText = "Menyimpan...";

            const transaksiBaru = {
                tanggal: document.getElementById('tanggal').value,
                jenis: document.getElementById('jenis').value,
                kategori: document.getElementById('kategori').value,
                nominal: Number(document.getElementById('nominal').value)
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(transaksiBaru)
                });

                if (!res.ok) throw new Error("Gagal menyimpan data");

                await muatDataDariNeon();
                document.getElementById('nominal').value = '';
            } catch (err) {
                alert("Terjadi kesalahan saat menyimpan transaksi!");
            } finally {
                btnSimpan.disabled = false;
                btnSimpan.innerText = "Simpan Ke Database";
            }
        });

        // 6. Hapus Satu Transaksi
        async function hapusTransaksi(id) {
            if (confirm('Yakin ingin menghapus transaksi ini?')) {
                try {
                    const res = await fetch(`${API_URL}?id=${id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error("Gagal menghapus");
                    await muatDataDariNeon();
                } catch (err) {
                    alert("Gagal menghapus data dari database!");
                }
            }
        }

        // 7. Reset Semua Data
        async function hapusSemuaData() {
            if (confirm('Hapus SELURUH transaksi di database Neon.tech?')) {
                try {
                    const res = await fetch(API_URL, { method: 'DELETE' });
                    if (!res.ok) throw new Error("Gagal reset");
                    await muatDataDariNeon();
                } catch (err) {
                    alert("Gagal mengosongkan database!");
                }
            }
        }

        // 8. Ekspor ke Excel
        function eksporKeExcel() {
            if (daftarTransaksi.length === 0) {
                alert('Belum ada data untuk diekspor!');
                return;
            }

            const dataExcel = daftarTransaksi.map((item, index) => ({
                'No': index + 1,
                'Tanggal': typeof item.tanggal === 'string' ? item.tanggal.split('T')[0] : item.tanggal,
                'Jenis': item.jenis === 'pemasukan' ? 'Pemasukan' : 'Pengeluaran',
                'Kategori': item.kategori,
                'Nominal (Rp)': Number(item.nominal)
            }));

            const ws = XLSX.utils.json_to_sheet(dataExcel);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Catatan Keuangan");
            XLSX.writeFile(wb, "Catatan_Keuangan_NeonDB.xlsx");
        }

        // Inisialisasi awal
        perbaruiDropdownKategoriForm();
        isiDropdownFilterKategori();
        muatDataDariNeon();
    </script>
</body>
</html>
